name: Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK terms must be reviewed and accepted by an authorized owner
      # (and, where appropriate, a parent/guardian) before enabling this build.
      - name: Require Android SDK license approval
        env:
          ANDROID_SDK_LICENSES_ACCEPTED: ${{ vars.ANDROID_SDK_LICENSES_ACCEPTED }}
        run: |
          if [ "$ANDROID_SDK_LICENSES_ACCEPTED" != "true" ]; then
            echo "::error::Review the Android SDK license, then set ANDROID_SDK_LICENSES_ACCEPTED=true in repository Actions variables."
            exit 1
          fi

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core for Android ABIs
        run: cargo ndk -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release -p mesh-core

      - name: Run Android unit tests and assemble APK
        working-directory: android
        run: |
          bash ./gradlew testDebugUnitTest
          bash ./gradlew assembleDebug

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/NexoraMesh-Android-debug.apk
          cd dist/android
          sha256sum NexoraMesh-Android-debug.apk > SHA256SUMS.txt
          {
            echo "Nexora Mesh Android debug build"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Package: org.nexora.mesh"
            echo "Minimum Android: 8.0 (API 26)"
            echo "Build type: debug; test use only"
          } > BUILD-INFO.txt

      - name: Upload installable debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-mesh-android-debug
          path: |
            dist/android/NexoraMesh-Android-debug.apk
            dist/android/SHA256SUMS.txt
            dist/android/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 90

      # A production-signed APK is built only when an authorized owner supplies
      # a private keystore and its credentials through repository Actions secrets.
      - name: Prepare private release keystore
        if: ${{ secrets.MESH_RELEASE_KEYSTORE_BASE64 != '' && secrets.MESH_RELEASE_STORE_PASSWORD != '' && secrets.MESH_RELEASE_KEY_ALIAS != '' && secrets.MESH_RELEASE_KEY_PASSWORD != '' }}
        env:
          MESH_RELEASE_KEYSTORE_BASE64: ${{ secrets.MESH_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$MESH_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexora-release.keystore"
          echo "MESH_RELEASE_STORE_FILE=$RUNNER_TEMP/nexora-release.keystore" >> "$GITHUB_ENV"

      - name: Build optimized signed release APK
        if: ${{ secrets.MESH_RELEASE_KEYSTORE_BASE64 != '' && secrets.MESH_RELEASE_STORE_PASSWORD != '' && secrets.MESH_RELEASE_KEY_ALIAS != '' && secrets.MESH_RELEASE_KEY_PASSWORD != '' }}
        working-directory: android
        env:
          MESH_RELEASE_STORE_FILE: ${{ runner.temp }}/nexora-release.keystore
          MESH_RELEASE_STORE_PASSWORD: ${{ secrets.MESH_RELEASE_STORE_PASSWORD }}
          MESH_RELEASE_KEY_ALIAS: ${{ secrets.MESH_RELEASE_KEY_ALIAS }}
          MESH_RELEASE_KEY_PASSWORD: ${{ secrets.MESH_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease

      - name: Upload optimized signed release APK
        if: ${{ secrets.MESH_RELEASE_KEYSTORE_BASE64 != '' && secrets.MESH_RELEASE_STORE_PASSWORD != '' && secrets.MESH_RELEASE_KEY_ALIAS != '' && secrets.MESH_RELEASE_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexora-mesh-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK on GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Nexora Mesh ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/android/NexoraMesh-Android-debug.apk
            dist/android/SHA256SUMS.txt
            dist/android/BUILD-INFO.txt
