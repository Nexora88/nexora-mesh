name: Desktop Native Build

concurrency:
  group: nexora-mesh-desktop
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: ["main", "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
            artifact: linux
          - os: windows-latest
            bundles: msi,nsis
            artifact: windows
          - os: macos-latest
            bundles: dmg,app
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build native desktop bundles
        working-directory: desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Upload native desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-mesh-desktop-${{ matrix.artifact }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
