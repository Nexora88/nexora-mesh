name: NexoraMesh
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Nexora Mesh, yakındaki cihazlarla yerel bağlantı kurmak için Bluetooth kullanır."
    INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "Nexora Mesh, yakındaki cihazlarla yerel bağlantı kurmak için Bluetooth kullanır."
    INFOPLIST_KEY_NSCameraUsageDescription: "Nexora Mesh, güvenilir cihaz QR kodlarını tarayıp kimlik parmak izini doğrulamak için kamerayı kullanır."
targets:
  NexoraMesh:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "**/*.swift"
    info:
      properties:
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
    dependencies:
      - framework: ../dist/ios/MeshCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nexora.mesh
        PRODUCT_NAME: NexoraMesh
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"

  NexoraMeshTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../iosTests
    dependencies:
      - target: NexoraMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nexora.mesh.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
