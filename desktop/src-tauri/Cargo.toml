[package]
name = "nexora-mesh-desktop"
version = "0.1.0"
description = "Nexora Mesh native desktop shell"
authors = ["Nexora"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
btleplug = "0.11"
tokio = { version = "1", features = ["sync", "time"] }
